name: Security Scan

concurrency:
  # A new run on the same ref cancels the one still in flight, so pushes
  # in quick succession don't each burn a full CI run.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  # Full-history baseline scan on the protected branches only. `development`
  # is dropped: its PR scan already covers the same commits, so pushing to it
  # while a release PR is open would run this twice for one SHA.
  push:
    branches: [main, master]
  # Weekly re-scan of the default branch, so a new CVE in code that has not
  # changed still surfaces. Sunday 17:23 UTC is early Monday morning in NZ.
  schedule:
    - cron: '23 17 * * 0'
  workflow_dispatch:

# Minimal permissions: the scanners only read the checkout.
permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # full history so the secret scan can cover every commit
          persist-credentials: false

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL -o "/tmp/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o /tmp/gitleaks_checksums.txt "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (cd /tmp && grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks_checksums.txt | sha256sum -c -)
          tar -xzf "/tmp/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # On a PR, scan only the commits the PR adds. A secret already sitting in
      # history then blocks the PR that introduced it, not every later one.
      - name: Scan PR commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gitleaks git . --redact -v --no-banner \
            --log-opts="--no-merges ${BASE_SHA}..${HEAD_SHA}"

      # On push, schedule or manual run, scan the whole history as a baseline.
      - name: Scan full history
        if: github.event_name != 'pull_request'
        run: gitleaks git . --redact -v --no-banner

  trivy:
    name: trivy (vulns + misconfig)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Filesystem scan: vulnerable dependencies plus IaC / Dockerfile
      # misconfiguration, CRITICAL and HIGH, fixable only. One scan writes a
      # JSON report; the steps below turn it into a summary and a gate.
      # Triaged and baselined findings live in .trivyignore.yaml.
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'
          format: json
          output: trivy-fs.json
          timeout: '15m'
          trivyignores: .trivyignore.yaml

      - name: Render findings as a table
        run: trivy convert --format table --output trivy-fs.txt trivy-fs.json

      - name: Write findings to the job summary
        if: always()
        run: |
          [ -f trivy-fs.txt ] || exit 0
          cat trivy-fs.txt
          {
            echo '## Trivy filesystem scan: CRITICAL and HIGH, fixable'
            echo
            if [ -s trivy-fs.txt ]; then
              echo '```'
              cat trivy-fs.txt
              echo '```'
            else
              echo 'No findings.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # HIGH findings are report-only. A CRITICAL finding fails the job unless
      # .trivyignore.yaml baselines it, so a new critical blocks the PR.
      - name: Fail on new CRITICAL findings
        run: trivy convert --format table --severity CRITICAL --exit-code 1 trivy-fs.json
